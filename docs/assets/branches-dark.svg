<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" role="img" aria-label="Branch and release flow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#AEBCB9"/></marker><marker id="aha" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#5FC2D1"/></marker></defs>
<rect x="0" y="0" width="920" height="200" fill="#0F1516"/>

<rect x="197" y="14" width="100" height="30" rx="6" fill="none" stroke="#2A3537" stroke-dasharray="4 3"/><text x="247" y="33.375" fill="#AEBCB9" font-size="12.5" text-anchor="middle">next</text>
<text x="120" y="33" text-anchor="middle" font-size="11" fill="#7E8F8C">issues labelled next →</text>
<path d="M247,44 V62" fill="none" stroke="#7E8F8C" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="330" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#7E8F8C">merge-back PR</text>
<rect x="17" y="64" width="130" height="40" rx="6" fill="#161E20" stroke="#2A3537" stroke-width="1.2"/><text x="82" y="88.375" fill="#E4ECEA" font-size="12.5" text-anchor="middle">feature/&lt;slug&gt;</text>
<rect x="197" y="64" width="100" height="40" rx="6" fill="#15363B" stroke="#5FC2D1" stroke-width="1.4"/><text x="247" y="88.375" fill="#E4ECEA" font-size="12.5" text-anchor="middle">staging</text>
<rect x="347" y="64" width="90" height="40" rx="6" fill="#161E20" stroke="#2A3537" stroke-width="1.2"/><text x="392" y="88.375" fill="#E4ECEA" font-size="12.5" text-anchor="middle">main</text>
<rect x="487" y="64" width="110" height="40" rx="6" fill="#161E20" stroke="#2A3537" stroke-width="1.2"/><text x="542" y="88.375" fill="#E4ECEA" font-size="12.5" text-anchor="middle">release PR</text>
<rect x="647" y="64" width="110" height="40" rx="6" fill="#161E20" stroke="#2A3537" stroke-width="1.2"/><text x="702" y="88.375" fill="#E4ECEA" font-size="12.5" text-anchor="middle">vX.Y.Z tag</text>
<rect x="807" y="64" width="96" height="40" rx="6" fill="none" stroke="#2A3537" stroke-dasharray="4 3"/><text x="855" y="88.375" fill="#AEBCB9" font-size="12.5" text-anchor="middle">release/vX.Y</text>
<g stroke="#AEBCB9" stroke-width="1.4" fill="none" marker-end="url(#ah)"><path d="M147,84 H195"/><path d="M297,84 H345"/><path d="M437,84 H485"/><path d="M597,84 H645"/></g>
<path d="M757,84 H805" fill="none" stroke="#7E8F8C" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#7E8F8C" text-anchor="middle">
<text x="82" y="120">one per issue</text>
<text x="392" y="120">release branch</text>
<text x="171" y="140">PR · merge-commit</text>
<text x="322" y="140">promotion PR</text>
<text x="322" y="154">operator</text>
<text x="462" y="140">release-please</text>
<text x="462" y="154">feat → minor · fix → patch</text>
<text x="622" y="140">merge → tag</text>
<text x="622" y="154">+ GitHub Release</text>
<text x="781" y="140">wind-back line</text>
<text x="781" y="154">optional</text>
</g>
<path d="M702,104 V172 H247 V106" fill="none" stroke="#5FC2D1" stroke-width="1.3" marker-end="url(#aha)"/>
<text x="474" y="188" text-anchor="middle" font-size="11" fill="#5FC2D1">back-sync-release workflow merges the release commit back into staging</text>
</svg>

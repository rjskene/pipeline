<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 236" width="920" height="236" role="img" aria-label="Trust boundary" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs></defs>
<rect x="0" y="0" width="920" height="236" fill="#0F1516"/>

<rect x="17" y="14" width="432" height="208" rx="8" fill="#161E20" stroke="#2A3537" stroke-width="1.2"/>
<rect x="471" y="14" width="432" height="208" rx="8" fill="none" stroke="#5FC2D1" stroke-width="1.4" stroke-dasharray="5 4"/>
<g font-size="13" font-weight="600" fill="#E4ECEA"><text x="33" y="40">Ships with the plugin · hooks/</text><text x="487" y="40">Operator owns · outside the repo</text></g>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#7E8F8C"><text x="33" y="56">PreToolUse tripwires by tool matcher, plus two lifecycle hooks</text><text x="487" y="56">the actual boundary</text></g>
<text x="33" y="86" font-size="12" fill="#E4ECEA">PRs target staging, never main</text>
<text x="433" y="86" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#5FC2D1">Bash</text>
<text x="487" y="86" font-size="12" fill="#E4ECEA">Claude Code permission mode and the bridge policy</text>
<g stroke="#2A3537" stroke-width="1"><path d="M33,96 H433"/><path d="M487,96 H887"/></g>
<text x="33" y="112" font-size="12" fill="#E4ECEA">no CI-skip markers in commits or PRs</text>
<text x="433" y="112" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#5FC2D1">Bash</text>
<text x="487" y="112" font-size="12" fill="#E4ECEA">which repos, branches and tokens the session can reach</text>
<g stroke="#2A3537" stroke-width="1"><path d="M33,122 H433"/><path d="M487,122 H887"/></g>
<text x="33" y="138" font-size="12" fill="#E4ECEA">PATH C: orchestrator never edits impl files</text>
<text x="433" y="138" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#5FC2D1">Edit · Write</text>
<text x="487" y="138" font-size="12" fill="#E4ECEA">deleting worktrees, pruning logs, force-pushing anything</text>
<g stroke="#2A3537" stroke-width="1"><path d="M33,148 H433"/><path d="M487,148 H887"/></g>
<text x="33" y="164" font-size="12" fill="#E4ECEA">no yield while CI is still running</text>
<text x="433" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#5FC2D1">Stop</text>
<text x="487" y="164" font-size="12" fill="#E4ECEA">branch protection on main</text>
<g stroke="#2A3537" stroke-width="1"><path d="M33,174 H433"/><path d="M487,174 H887"/></g>
<text x="33" y="190" font-size="12" fill="#E4ECEA">headless: unanswered escalations are denied</text>
<text x="433" y="190" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#5FC2D1">PermissionRequest</text>
<text x="487" y="190" font-size="12" fill="#E4ECEA">promoting staging → main and cutting the release</text>
</svg>

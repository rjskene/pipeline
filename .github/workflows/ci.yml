name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: consumer-.claude/ write lint
        run: bash scripts/check-no-consumer-claude-writes.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: test suite (strict)
        run: |
          fail=0
          for t in tests/test*.sh tests/test_*.sh; do
            [ -f "$t" ] || continue
            echo "::group::$t"
            bash "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
